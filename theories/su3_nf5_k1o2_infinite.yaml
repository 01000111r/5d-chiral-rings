id: su3_nf5_k1o2_infinite
title: SU(3)+5F at infinite coupling with |k|=1/2
nonphysical: false
gauge_algebra: A2
gauge_display_name: SU(3)
number_of_flavours: 5
chern_simons_level: "1/2"
chern_simons_convention: absolute value
coupling: infinite
grading_variable: t
source_references:
