id: su4_nf7_k1o2_infinite
title: SU(4)+7F at infinite coupling with |k|=1/2
nonphysical: false
gauge_algebra: A3
gauge_display_name: SU(4)
number_of_flavours: 7
chern_simons_level: "1/2"
chern_simons_convention: absolute value
coupling: infinite
grading_variable: t
source_references:
  - path: references/overleaf/su3_5f_6f_hwg_results.tex
    description: General N_f=2N-1, |k|=1/2 HWG, specialized term-by-term at N=4
    equation: "12.3"
simple_factors:
