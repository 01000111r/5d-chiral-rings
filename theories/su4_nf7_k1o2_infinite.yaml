    - {coefficient: 1, monomial: {t_degree: 4, representations: {enhanced: [0, 1, 0, 0, 1, 0], su2: [0]}, abelian_charges: {q: 0}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {enhanced: [0, 0, 1, 0, 0, 0], su2: [1]}, abelian_charges: {q: 1}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {enhanced: [0, 0, 0, 1, 0, 0], su2: [1]}, abelian_charges: {q: -1}}}
    - {coefficient: 1, monomial: {t_degree: 6, representations: {enhanced: [0, 0, 1, 1, 0, 0], su2: [0]}, abelian_charges: {q: 0}}}
