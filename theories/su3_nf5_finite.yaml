    - {coefficient: 1, monomial: {t_degree: 2, representations: {flavour: [1, 0, 0, 1]}, abelian_charges: {beta: 0}}}
    - {coefficient: 1, monomial: {t_degree: 3, representations: {flavour: [0, 0, 1, 0]}, abelian_charges: {beta: 1}}}
    - {coefficient: 1, monomial: {t_degree: 3, representations: {flavour: [0, 1, 0, 0]}, abelian_charges: {beta: -1}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {flavour: [0, 1, 1, 0]}, abelian_charges: {beta: 0}}}
rational_product:
  original_rational_product_latex: |-
    \frac{1}{(1-t^2)(1-\mu_1\mu_4t^2)(1-\beta\mu_3t^3)
    (1-\beta^{-1}\mu_2t^3)(1-\mu_2\mu_3t^4)}
  factors:
    - {power: -1, monomial: {t_degree: 2, representations: {flavour: [0, 0, 0, 0]}, abelian_charges: {beta: 0}}}
    - {power: -1, monomial: {t_degree: 2, representations: {flavour: [1, 0, 0, 1]}, abelian_charges: {beta: 0}}}
    - {power: -1, monomial: {t_degree: 3, representations: {flavour: [0, 0, 1, 0]}, abelian_charges: {beta: 1}}}
    - {power: -1, monomial: {t_degree: 3, representations: {flavour: [0, 1, 0, 0]}, abelian_charges: {beta: -1}}}
    - {power: -1, monomial: {t_degree: 4, representations: {flavour: [0, 1, 1, 0]}, abelian_charges: {beta: 0}}}
