    cartan_type: A
    rank: 6
    display_name: SU(7)
    highest_weight_fugacities: [mu_1, mu_2, mu_3, mu_4, mu_5, mu_6]
abelian_factors:
  - id: beta
    display_name: U(1)_B
    fugacity: beta
pe:
  original_pe_latex: |-
    \PE\!\left[(1+\mu_1\mu_6)t^2
    +(\mu_2\mu_5+\beta\mu_4+\beta^{-1}\mu_3)t^4
    +\mu_3\mu_4t^6\right]
  terms:
    - {coefficient: 1, monomial: {t_degree: 2, representations: {flavour: [0, 0, 0, 0, 0, 0]}, abelian_charges: {beta: 0}}}
    - {coefficient: 1, monomial: {t_degree: 2, representations: {flavour: [1, 0, 0, 0, 0, 1]}, abelian_charges: {beta: 0}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {flavour: [0, 1, 0, 0, 1, 0]}, abelian_charges: {beta: 0}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {flavour: [0, 0, 0, 1, 0, 0]}, abelian_charges: {beta: 1}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {flavour: [0, 0, 1, 0, 0, 0]}, abelian_charges: {beta: -1}}}
    - {coefficient: 1, monomial: {t_degree: 6, representations: {flavour: [0, 0, 1, 1, 0, 0]}, abelian_charges: {beta: 0}}}
rational_product:
  original_rational_product_latex: |-
    \frac{1}{(1-t^2)(1-\mu_1\mu_6t^2)(1-\mu_2\mu_5t^4)
    (1-\beta\mu_4t^4)(1-\beta^{-1}\mu_3t^4)(1-\mu_3\mu_4t^6)}
  factors:
    - {power: -1, monomial: {t_degree: 2, representations: {flavour: [0, 0, 0, 0, 0, 0]}, abelian_charges: {beta: 0}}}
    - {power: -1, monomial: {t_degree: 2, representations: {flavour: [1, 0, 0, 0, 0, 1]}, abelian_charges: {beta: 0}}}
    - {power: -1, monomial: {t_degree: 4, representations: {flavour: [0, 1, 0, 0, 1, 0]}, abelian_charges: {beta: 0}}}
    - {power: -1, monomial: {t_degree: 4, representations: {flavour: [0, 0, 0, 1, 0, 0]}, abelian_charges: {beta: 1}}}
    - {power: -1, monomial: {t_degree: 4, representations: {flavour: [0, 0, 1, 0, 0, 0]}, abelian_charges: {beta: -1}}}
    - {power: -1, monomial: {t_degree: 6, representations: {flavour: [0, 0, 1, 1, 0, 0]}, abelian_charges: {beta: 0}}}
