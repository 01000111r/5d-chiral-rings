[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwg-pipeline"
version = "0.1.0"
description = "SageMath-only infrastructure for an HWG analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
