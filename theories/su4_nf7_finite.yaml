id: su4_nf7_finite
title: SU(4)+7F classical Higgs branch at finite coupling
nonphysical: false
gauge_algebra: A3
gauge_display_name: SU(4)
number_of_flavours: 7
chern_simons_level: 0
chern_simons_convention: none for this finite-coupling reference
coupling: finite
grading_variable: t
source_references:
  - path: references/overleaf/su4_nf7_finite_hwg_results.tex
    description: Committed authoritative finite-coupling HWG specialization
    equation: "5.52, specialised to N_c=4 and N_f=7"
simple_factors:
