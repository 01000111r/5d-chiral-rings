schema_version: 1
id: su4_nf7_k3o2_manifest_canonical
source_theory_id: su4_nf7_k3o2_infinite
branching_id: su4_nf7_k3o2_to_manifest
raw_charges: [x, q]
physical_charges: [B, I]
expected_unique: true
charge_lattice: {B_step: "1/2", I_step: 1}
defining_anchors:
  - id: classical_antibaryon
    t_degree: 4
    child_dynkin_labels: [0, 0, 1, 0, 0, 0]
    raw_charges: {x: 3, q: 1}
    physical_charges: {B: -4, I: 0}
    justification: Independently calculated finite beta-graded PL and exact raw branching.
  - id: negative_cs_E_minus
    t_degree: 2
    child_dynkin_labels: [1, 0, 0, 0, 0, 0]
    raw_charges: {x: 8, q: 0}
    physical_charges: {B: "-5/2", I: 1}
    justification: Negative-CS orientation, exact branching, and project zero-mode convention.
validation_anchors:
  - id: anti_instanton
    t_degree: 2
    child_dynkin_labels: [0, 0, 0, 0, 0, 1]
    raw_charges: {x: -8, q: 0}
    physical_charges: {B: "5/2", I: -1}
  - id: classical_baryon
    t_degree: 4
    child_dynkin_labels: [0, 0, 0, 1, 0, 0]
    raw_charges: {x: -3, q: -1}
    physical_charges: {B: 4, I: 0}
  - id: mixed_anti_instanton
    t_degree: 4
    child_dynkin_labels: [0, 1, 0, 0, 0, 0]
    raw_charges: {x: -5, q: 1}
    physical_charges: {B: "-3/2", I: -1}
  - id: mixed_instanton
    t_degree: 4
    child_dynkin_labels: [0, 0, 0, 0, 1, 0]
    raw_charges: {x: 5, q: -1}
    physical_charges: {B: "3/2", I: 1}
notes:
  - B is microscopic baryon number with B(Q)=1.
  - The signed-CS orientation is k=-3/2 although the source HWG depends on |k|.
