    \PE\!\left[(\mu_1\mu_4+\nu^2+1)t^2
    +\nu(q\mu_2+q^{-1}\mu_3)t^3
    +\mu_2\mu_3t^4-\nu^2\mu_2\mu_3t^6\right]
  terms:
    - {coefficient: 1, monomial: {t_degree: 2, representations: {enhanced: [0, 0, 0, 0], su2: [0]}, abelian_charges: {q: 0}}}
    - {coefficient: 1, monomial: {t_degree: 2, representations: {enhanced: [0, 0, 0, 0], su2: [2]}, abelian_charges: {q: 0}}}
    - {coefficient: 1, monomial: {t_degree: 2, representations: {enhanced: [1, 0, 0, 1], su2: [0]}, abelian_charges: {q: 0}}}
    - {coefficient: 1, monomial: {t_degree: 3, representations: {enhanced: [0, 1, 0, 0], su2: [1]}, abelian_charges: {q: 1}}}
    - {coefficient: 1, monomial: {t_degree: 3, representations: {enhanced: [0, 0, 1, 0], su2: [1]}, abelian_charges: {q: -1}}}
    - {coefficient: 1, monomial: {t_degree: 4, representations: {enhanced: [0, 1, 1, 0], su2: [0]}, abelian_charges: {q: 0}}}
    - {coefficient: -1, monomial: {t_degree: 6, representations: {enhanced: [0, 1, 1, 0], su2: [2]}, abelian_charges: {q: 0}}}
rational_product:
  original_rational_product_latex: |-
    \frac{1-\nu^2\mu_2\mu_3t^6}
    {(1-t^2)(1-\nu^2t^2)(1-\mu_1\mu_4t^2)
     (1-\nu q\mu_2t^3)(1-\nu q^{-1}\mu_3t^3)(1-\mu_2\mu_3t^4)}
  factors:
    - {power: 1, monomial: {t_degree: 6, representations: {enhanced: [0, 1, 1, 0], su2: [2]}, abelian_charges: {q: 0}}}
    - {power: -1, monomial: {t_degree: 2, representations: {enhanced: [0, 0, 0, 0], su2: [0]}, abelian_charges: {q: 0}}}
    - {power: -1, monomial: {t_degree: 2, representations: {enhanced: [0, 0, 0, 0], su2: [2]}, abelian_charges: {q: 0}}}
    - {power: -1, monomial: {t_degree: 2, representations: {enhanced: [1, 0, 0, 1], su2: [0]}, abelian_charges: {q: 0}}}
    - {power: -1, monomial: {t_degree: 3, representations: {enhanced: [0, 1, 0, 0], su2: [1]}, abelian_charges: {q: 1}}}
    - {power: -1, monomial: {t_degree: 3, representations: {enhanced: [0, 0, 1, 0], su2: [1]}, abelian_charges: {q: -1}}}
    - {power: -1, monomial: {t_degree: 4, representations: {enhanced: [0, 1, 1, 0], su2: [0]}, abelian_charges: {q: 0}}}
